<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="60%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="neonPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" />
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="180" cy="180" r="140" fill="#00f5ff" opacity="0.12" filter="url(#intenseGlow)" />
  <circle cx="340" cy="320" r="130" fill="#8b5cf6" opacity="0.15" filter="url(#intenseGlow)" />

  <!-- Geometric Grid Background Pattern (DirectX Wave & NVMe Neural Stream Aesthetic) -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.2">
    <path d="M70 256 H442 M256 70 V442" />
    <circle cx="256" cy="256" r="170" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="115" fill="none" stroke-dasharray="4 6" />
  </g>

  <!-- Central Emblem: Turbo-Fieldfare & Turbine Assembly -->
  <g id="main-emblem">
    <!-- Outer Turbine Shroud / Accelerator Ring -->
    <circle cx="256" cy="256" r="105" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="4.5" opacity="0.85" filter="url(#neonGlowCyan)" />
    
    <!-- Turbine Stator Blades (DirectCompute Wave Engine) -->
    <g stroke="url(#cyanBlueGrad)" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <line x1="256" y1="156" x2="256" y2="186" />
      <line x1="326.7" y1="185.3" x2="305.5" y2="206.5" />
      <line x1="356" y1="256" x2="326" y2="256" />
      <line x1="326.7" y1="326.7" x2="305.5" y2="305.5" />
      <line x1="256" y1="356" x2="256" y2="326" />
      <line x1="185.3" y1="326.7" x2="206.5" y2="305.5" />
      <line x1="156" y1="256" x2="186" y2="256" />
      <line x1="185.3" y1="185.3" x2="206.5" y2="206.5" />
    </g>

    <!-- Fieldfare Primary Wings (Aerodynamic Speed Layers) -->
    <path d="M120 160 C165 145, 230 155, 275 195 C250 205, 205 210, 160 215 C135 195, 122 175, 120 160 Z" 
          fill="url(#cyanBlueGrad)" opacity="0.95" filter="url(#neonGlowCyan)" />
    
    <path d="M100 210 C150 195, 215 210, 255 245 C225 255, 180 260, 138 262 C115 245, 105 225, 100 210 Z" 
          fill="url(#cyanBlueGrad)" opacity="0.85" />
    
    <path d="M90 265 C135 255, 195 265, 230 295 C200 302, 160 305, 120 305 C100 290, 92 278, 90 265 Z" 
          fill="url(#neonPurpleGrad)" opacity="0.8" filter="url(#neonGlowPurple)" />

    <!-- Fieldfare Crest & Head (Sleek Supersonic Profile) -->
    <path d="M260 185 C295 160, 350 155, 385 170 C410 180, 425 190, 435 192 C415 205, 395 212, 380 218 C365 240, 345 265, 315 285 C310 260, 305 230, 280 210 Z" 
          fill="url(#cyanBlueGrad)" filter="url(#neonGlowCyan)" />

    <!-- Avian Eye Accent -->
    <circle cx="370" cy="188" r="6.5" fill="#ffffff" filter="url(#neonGlowCyan)" />
    <circle cx="370" cy="188" r="3.5" fill="#00f5ff" />

    <!-- Tail Plumage -->
    <path d="M210 320 C185 365, 140 405, 105 425 C135 395, 165 360, 185 328 Z" 
          fill="url(#neonPurpleGrad)" filter="url(#neonGlowPurple)" opacity="0.9" />
    <path d="M235 325 C215 375, 175 420, 140 445 C168 410, 198 370, 215 330 Z" 
          fill="url(#cyanBlueGrad)" opacity="0.85" />

    <!-- Central High-Voltage Lightning Bolt -->
    <polygon points="285,130 215,260 265,260 220,385 325,235 270,235" 
             fill="url(#lightningGrad)" 
             stroke="#ffffff" 
             stroke-width="2.5" 
             stroke-linejoin="round"
             filter="url(#intenseGlow)" />

    <!-- Core Center Cap -->
    <circle cx="256" cy="256" r="22" fill="#080d1a" stroke="url(#cyanBlueGrad)" stroke-width="3" />
    <circle cx="256" cy="256" r="10" fill="url(#cyanBlueGrad)" filter="url(#neonGlowCyan)" />
    <circle cx="256" cy="256" r="4" fill="#ffffff" />
  </g>

  <!-- High-Tech Corner Trims -->
  <g stroke="url(#borderGrad)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M50 90 L50 50 L90 50" />
    <path d="M462 90 L462 50 L422 50" />
    <path d="M50 422 L50 462 L90 462" />
    <path d="M462 422 L462 462 L422 462" />
  </g>
</svg>
